[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcw-common"
version = "1.0.0"
description = "Shared kernel (money, events, bus, outbox, observability) for the mini crypto wallet platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "sqlalchemy>=2.0.30",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "redis>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
